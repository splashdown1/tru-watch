<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12100e">
<title>TRU WATCH</title>
<style>
:root{--bg:#12100e;--ink:#f3eee6;--dim:#b7aa98;--line:#3a3228;--lamp:#e2c27a;--card:#1e1a16;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--lamp)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0e0c0a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--lamp);color:#1a140c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--lamp);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>WATCH</span></h1><p class="sub">One awake. A relief. A challenge word. FM 22-6. Not a sentry manual.</p></header>
<div class="warn">If you do not know them, they do not pass. The one on watch never says the password first. This card does not post a weapon.</div>
<div class="bar"><input id="q" placeholder="relief, word, awake…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"One awake",d:"Someone is awake for the stretch you named. Sleeping in turns is not the same as no one awake. The fire can die. The camp cannot."},
{t:"The stretch",d:"Name the hours before you lie down. A short watch you can finish beats a long one you sleep through. Clock holds the face. This card holds the turn."},
{t:"Relief",d:"The one coming on is briefed before the one going off lies down. The word. The ground. Who is out. Who is due back. The last person does not leave the post empty."},
{t:"The word",d:"A countersign is two parts. The challenge is spoken by the one on watch. The password is the reply, from the one arriving. Low tone, so it is not a shout across the camp. The watch does not say the password. If the reply is wrong, or missing, they do not pass."},
{t:"The ground",d:"Know the path in and the path out before dark. A friend who comes in the wrong way is still a friend you cannot see. Agree the way in while you can still point at it."},
{t:"Gap",d:"No fields of fire, no post orders, no weapon. FM 22-6 is a guard manual. This ship is a turn and a word."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">WATCH</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">FM 22-6: challenge by the guard, password by the one challenged, low tone. Not a sentry manual.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No sentry manual.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
